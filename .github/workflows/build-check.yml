name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate WebP assets
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          root = Path("assets/images")
          files = sorted(root.glob("*.webp"))
          if not files:
              raise SystemExit("Geen WebP-assets gevonden")

          for path in files:
              with Image.open(path) as im:
                  im.verify()
              with Image.open(path) as im:
                  width, height = im.size
                  if width < 320 or height < 240:
                      raise SystemExit(f"Afbeelding te klein: {path} ({width}x{height})")
              print(f"OK {path}")
          PY

      - name: Build static site
        run: python3 build.py
      - name: Verify SEO outputs
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          grep -q 'class="hero"' dist/index.html
          grep -q 'class="brand" href="/"' dist/index.html
          test -f dist/assets/styles-base.css
          test -f dist/assets/app-base.js
          test -f dist/assets/images/thai-head-massage.webp
          test -f dist/assets/images/hot-stone-massage.webp
          test -f dist/assets/images/thai-leg-massage.webp
          test -f dist/assets/images/thai-hand-massage.webp
          test -f dist/assets/images/thai-back-massage.webp
          test -f dist/assets/images/thai-oil-massage.webp
          test -f dist/assets/images/thai-shoulder-massage.webp
          test -f dist/assets/images/thai-shoulder-closeup.webp
          test -f dist/assets/images/thai-herbal-compress.webp
          test -f dist/404.html
          test -f dist/massages.html
          test -f dist/prijzen.html
          test -f dist/contact.html
          test -f dist/thaise-massage-capelle-aan-den-ijssel.html
          test -f dist/aromatherapie-massage-capelle.html
          test -f dist/sportmassage-capelle.html
          test -f dist/hot-stone-massage-capelle.html
          test -f dist/duo-massage-capelle.html
          grep -q "Thaise Massage Capelle aan den IJssel" dist/index.html
          grep -q "sitemap.xml" dist/robots.txt
          grep -q "thaise-massage-capelle-aan-den-ijssel" dist/sitemap.xml
          grep -q "FAQPage" dist/index.html
          grep -q "HealthAndBeautyBusiness" dist/index.html
          grep -q "max-image-preview:large" dist/index.html
          grep -q 'hreflang="nl-NL"' dist/index.html
          grep -q "image:image" dist/sitemap.xml
          grep -q "Thaise massage in Capelle" dist/index.html
          grep -q 'name="robots" content="noindex,follow"' dist/privacy.html
          grep -q 'name="robots" content="noindex,follow"' dist/voorwaarden.html

      - name: Upload rendered site artifact
        uses: actions/upload-artifact@v4
        with:
          name: baitan-rendered-site
          path: dist/
          if-no-files-found: error
          retention-days: 3
